[package]
name = "server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
axum = "0.8.4"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
getrandom = "0.3.3"
jsonwebtoken = "9.3.1"
regex = "1.11.1"
rpassword = "7.4.0"
serde = { version = "1.0.219", features = ["derive"] }
# arbitrary_precision: numbers such as 0.5 pass through as text, never as f64 (the engine uses exact fractions).
serde_json = { version = "1.0.140", features = ["arbitrary_precision"] }
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "migrate", "macros", "json", "time", "uuid"] }
time = { version = "0.3.41", features = ["serde-well-known"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }

# Full debug info for our code only: the libraries' debug info made the build folder several GB.
[profile.dev.package."*"]
debug = false
